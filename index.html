<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="We create custom websites that help businesses grow online. Professional web design and development services tailored to your goals. Get a free consultation today."
    />
    <title>We Create Modern Websites That Convert | MaxStudio</title>
    <link rel="icon" type="image/png" href="images/Frame 1 (2).png" />
    <meta
      name="google-site-verification"
      content="umWEQIZofDbszhMbXHMxtKDAe2xY-axGbpUzk-V8BoQ"
    />

    <!-- Language detection and redirect -->
    <script>
      (function () {
        // Check if user has a saved language preference
        const savedLang = localStorage.getItem("selectedLanguage");

        // Get browser language
        const browserLang = navigator.language || navigator.userLanguage;
        const langCode = browserLang.split("-")[0]; // Get just 'en' from 'en-US'

        // Determine which language to use
        let targetLang = "en"; // default

        if (savedLang && (savedLang === "en" || savedLang === "ro")) {
          targetLang = savedLang;
        } else if (langCode === "ro") {
          targetLang = "ro";
        }

        // Redirect to the appropriate language version
        window.location.href = `/${targetLang}/index.html`;
      })();
    </script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: white;
      }

      .loader {
        text-align: center;
      }

      .loader h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .loader p {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 2rem auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      .manual-links {
        margin-top: 2rem;
        display: flex;
        gap: 1rem;
        justify-content: center;
      }

      .manual-links a {
        color: white;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        backdrop-filter: blur(10px);
        transition: background 0.3s ease;
      }

      .manual-links a:hover {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <h1>MaxStudio</h1>
      <div class="spinner"></div>
      <p>Redirecting to your preferred language...</p>
      <p>Redirecționare către limba preferată...</p>

      <div class="manual-links">
        <a href="/en/index.html">English</a>
        <a href="/ro/index.html">Română</a>
      </div>
    </div>

    <noscript>
      <style>
        .loader {
          display: none;
        }
      </style>
      <div style="text-align: center; padding: 2rem">
        <h1>MaxStudio</h1>
        <p>Please enable JavaScript or select your language:</p>
        <div style="margin-top: 2rem">
          <a href="/en/index.html" style="margin: 0 1rem">English</a>
          <a href="/ro/index.html" style="margin: 0 1rem">Română</a>
        </div>
      </div>
    </noscript>
  </body>
</html>
